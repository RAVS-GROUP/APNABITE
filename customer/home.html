<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f97316"
  >

  <meta
    name="description"
    content="Discover nearby homemade-food Kitchens on ApnaBite."
  >

  <title>Home | ApnaBite</title>

  <link
    rel="manifest"
    href="../manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="../assets/css/core.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/components.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/customer.css"
  >
</head>

<body class="customer-page">
  <header class="customer-header">
    <div class="customer-header__inner">
      <button
        id="location-button"
        class="customer-location"
        type="button"
        aria-label="Select delivery location"
      >
        <span class="customer-location__label">
          DELIVERING TO
        </span>

        <span
          id="header-location"
          class="customer-location__value"
        >
          Detecting your location…
        </span>
      </button>

      <button
        id="logout-button"
        class="icon-button"
        type="button"
        aria-label="Logout"
        title="Logout"
      >
        ↪
      </button>
    </div>
  </header>

  <main class="customer-main">
    <section class="customer-greeting">
      <h1
        id="customer-greeting"
        class="customer-greeting__title"
      >
        Hello!
      </h1>

      <p class="customer-greeting__text">
        What homemade food would you like today?
      </p>
    </section>

    <section
      id="location-card"
      class="location-permission-card"
    >
      <div
        class="location-permission-card__icon"
        aria-hidden="true"
      >
        ◎
      </div>

      <div class="location-permission-card__content">
        <h2 class="location-permission-card__title">
          Find nearby Kitchens
        </h2>

        <p
          id="location-status"
          class="location-permission-card__text"
        >
          Allow location access to discover Home Chefs near you.
        </p>
      </div>

      <button
        id="allow-location-button"
        class="button button--primary button--small"
        type="button"
      >
        USE LOCATION
      </button>
    </section>

    <section class="search-box">
      <label
        class="visually-hidden"
        for="kitchen-search"
      >
        Search Kitchens
      </label>

      <input
        id="kitchen-search"
        class="search-box__input"
        type="search"
        placeholder="Search Kitchens or food"
        autocomplete="off"
        disabled
      >

      <span
        class="search-box__icon"
        aria-hidden="true"
      >
        ⌕
      </span>
    </section>

    <section class="customer-section">
      <div class="horizontal-scroll">
        <button
          class="chip chip--active"
          type="button"
          disabled
        >
          All
        </button>

        <button
          class="chip"
          type="button"
          disabled
        >
          Veg
        </button>

        <button
          class="chip"
          type="button"
          disabled
        >
          Non-Veg
        </button>

        <button
          class="chip"
          type="button"
          disabled
        >
          Breakfast
        </button>

        <button
          class="chip"
          type="button"
          disabled
        >
          Lunch
        </button>

        <button
          class="chip"
          type="button"
          disabled
        >
          Dinner
        </button>
      </div>
    </section>

    <section class="customer-section">
      <div class="customer-section__header">
        <h2 class="customer-section__title">
          Nearby Kitchens
        </h2>

        <span
          id="backend-status"
          class="badge badge--warning"
        >
          Connecting
        </span>
      </div>

      <div
        id="kitchen-list"
        class="kitchen-list"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <nav
    class="customer-bottom-nav"
    aria-label="Customer navigation"
  >
    <div class="customer-bottom-nav__inner">
      <a
        class="customer-bottom-nav__item customer-bottom-nav__item--active"
        href="home.html"
        aria-current="page"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
         ⌂
        </span>

        <span>Home</span>
      </a>

      <a
        class="customer-bottom-nav__item"
        href="orders.html"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
          ◫
        </span>

        <span>Orders</span>
      </a>

      <a
        class="customer-bottom-nav__item"
        href="../customer/account.html#rewards"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
          ☆
        </span>

        <span>Rewards</span>
      </a>

      <a
        class="customer-bottom-nav__item"
        href="account.html"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
          ○
        </span>

        <span>Account</span>
      </a>
    </div>
  </nav>

  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>

  <script>
    (function() {
      'use strict';

      const greeting =
        document.getElementById(
          'customer-greeting'
        );

      const backendStatus =
        document.getElementById(
          'backend-status'
        );

      const kitchenList =
        document.getElementById(
          'kitchen-list'
        );

      const locationStatus =
        document.getElementById(
          'location-status'
        );

      const headerLocation =
        document.getElementById(
          'header-location'
        );

      const locationButton =
        document.getElementById(
          'allow-location-button'
        );

      const logoutButton =
        document.getElementById(
          'logout-button'
        );

      function showInitialKitchenState() {
        window.ApnaBiteUI.showEmptyState(
          kitchenList,
          {
            icon: '⌂',
            title: 'Kitchens coming next',
            message:
              'Your login and location are working. Nearby Kitchen discovery will be connected in the next backend phase.'
          }
        );
      }

      function updateGreeting(user) {
        const fullName =
          user && user.fullName
            ? user.fullName.trim()
            : '';

        const firstName =
          fullName
            ? fullName.split(/\s+/)[0]
            : '';

        greeting.textContent =
          firstName
            ? 'Hello, ' + firstName + '!'
            : 'Hello!';
      }

      async function validateCustomerSession() {
        if (
          !window.ApnaBiteCore
            .requireLocalSession(
              ['CUSTOMER']
            )
        ) {
          return null;
        }

        try {
          const response =
            await window.ApnaBiteAPI
              .validateSession();

          const user =
            response.data.user;

          if (
            !user ||
            user.role !== 'CUSTOMER'
          ) {
            window.ApnaBiteCore
              .redirectToRoleHome(
                user ? user.role : '',
                true
              );

            return null;
          }

          window.ApnaBiteCore.saveSession({
            sessionToken:
              window.ApnaBiteCore
                .getSessionToken(),
            user: user
          });

          updateGreeting(user);

          backendStatus.textContent =
            'Connected';

          backendStatus.className =
            'badge badge--success';

          return user;
        } catch (error) {
          window.ApnaBiteUI
            .handleApiError(error);

          return null;
        }
      }

      function requestLocation() {
        if (!navigator.geolocation) {
          locationStatus.textContent =
            'Location is not supported on this device.';

          headerLocation.textContent =
            'Add delivery address';

          return;
        }

        window.ApnaBiteUI
          .setButtonLoading(
            locationButton,
            true,
            'LOCATING…'
          );

        locationStatus.textContent =
          'Detecting your current location…';

        navigator.geolocation
          .getCurrentPosition(
            handleLocationSuccess,
            handleLocationError,
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 60000
            }
          );
      }

      async function handleLocationSuccess(
        position
      ) {
        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const locationData = {
          latitude: latitude,
          longitude: longitude,
          accuracyMeters:
            position.coords.accuracy,
          capturedAt:
            new Date().toISOString()
        };

        window.ApnaBiteCore
          .setJsonStorage(
            window.ApnaBiteCore
              .storageKeys.LOCATION,
            locationData
          );

        headerLocation.textContent =
          'Current location selected';

        locationStatus.textContent =
          'Location confirmed. Address matching will be connected next.';

        window.ApnaBiteUI
          .setButtonLoading(
            locationButton,
            false
          );

        locationButton.textContent =
          'UPDATED';

        locationButton.disabled = true;

        try {
          await window.ApnaBiteAPI.request(
            'user.updateLocation',
            {
              latitude: latitude,
              longitude: longitude
            },
            {
              retry: false,
              deduplicate: false
            }
          );

          window.ApnaBiteUI.showToast(
            'Location updated successfully.',
            'success'
          );
        } catch (error) {
          window.ApnaBiteUI
            .handleApiError(
              error,
              {
                redirectToLogin: true
              }
            );
        }
      }

      function handleLocationError(error) {
        window.ApnaBiteUI
          .setButtonLoading(
            locationButton,
            false
          );

        headerLocation.textContent =
          'Select delivery location';

        if (
          error &&
          error.code ===
            error.PERMISSION_DENIED
        ) {
          locationStatus.textContent =
            'Location permission was denied. You can allow it from browser settings.';

          window.ApnaBiteUI.showToast(
            'Location permission is required to find nearby Kitchens.',
            'warning'
          );

          return;
        }

        locationStatus.textContent =
          'Unable to detect location. Please try again.';

        window.ApnaBiteUI.showToast(
          'Unable to detect your location.',
          'error'
        );
      }

      async function logout() {
        const confirmed =
          await window.ApnaBiteUI
            .confirmAction({
              title: 'Logout?',
              message:
                'Do you want to logout from ApnaBite?',
              confirmText: 'LOGOUT',
              cancelText: 'CANCEL'
            });

        if (!confirmed) return;

        try {
          await window.ApnaBiteAPI.logout();
        } catch (error) {
          window.ApnaBiteCore
            .clearSession();
        }

        window.ApnaBiteCore.navigate(
          'login.html',
          true
        );
      }

      async function initialize() {
        window.ApnaBiteUI.showSkeletons(
          kitchenList,
          3
        );

        const user =
          await validateCustomerSession();

        if (!user) return;

        showInitialKitchenState();

        const savedLocation =
          window.ApnaBiteCore
            .getJsonStorage(
              window.ApnaBiteCore
                .storageKeys.LOCATION,
              null
            );

        if (savedLocation) {
          headerLocation.textContent =
            'Current location selected';

          locationStatus.textContent =
            'Saved location is available. Tap to refresh it.';

          locationButton.textContent =
            'REFRESH';
        } else {
          headerLocation.textContent =
            'Select delivery location';
        }
      }

      locationButton.addEventListener(
        'click',
        requestLocation
      );

      document
        .getElementById(
          'location-button'
        )
        .addEventListener(
          'click',
          requestLocation
        );

      logoutButton.addEventListener(
        'click',
        logout
      );

      window.ApnaBiteCore.ready(
        initialize
      );
    })();
  </script>
</body>
</html>
