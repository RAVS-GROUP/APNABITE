<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f97316"
  >

  <meta
    name="description"
    content="Discover nearby homemade-food Kitchens on ApnaBite."
  >

  <title>Home | ApnaBite</title>

  <link
    rel="manifest"
    href="../manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="../assets/css/core.css?v=15"
  >

  <link
    rel="stylesheet"
    href="../assets/css/components.css?v=15"
  >

  <link
    rel="stylesheet"
    href="../assets/css/customer.css?v=15"
  >
</head>

<body class="customer-page">
  <header class="customer-header">
    <div class="customer-header__inner">
      <button
        id="location-header-button"
        class="customer-location"
        type="button"
        aria-label="Change delivery location"
      >
        <span class="customer-location__label">
          DELIVERING TO
        </span>

        <span
          id="header-location"
          class="customer-location__value"
        >
          Select delivery location
        </span>
      </button>

      <button
        id="change-location-button"
        class="button button--secondary button--small"
        type="button"
      >
        CHANGE
      </button>
    </div>
  </header>

  <main class="customer-main">
    <section class="customer-greeting">
      <h1
        id="customer-greeting"
        class="customer-greeting__title"
      >
        Hello!
      </h1>

      <p class="customer-greeting__text">
        What homemade food would you like today?
      </p>
    </section>

    <section class="search-box">
      <label
        class="visually-hidden"
        for="kitchen-search"
      >
        Search Kitchens or food
      </label>

      <input
        id="kitchen-search"
        class="search-box__input"
        type="search"
        placeholder="Search Kitchens or food"
        autocomplete="off"
        disabled
      >

      <span
        class="search-box__icon"
        aria-hidden="true"
      >
        ⌕
      </span>
    </section>

    <section class="customer-section customer-filter-section">
      <div class="horizontal-scroll">
        <button
          class="chip chip--active"
          type="button"
          data-kitchen-category="ALL"
          disabled
        >
          All
        </button>

        <button
          class="chip"
          type="button"
          data-kitchen-category="VEG"
          disabled
        >
          Veg
        </button>

        <button
          class="chip"
          type="button"
          data-kitchen-category="NON_VEG"
          disabled
        >
          Non-Veg
        </button>

        <button
          class="chip"
          type="button"
          data-kitchen-category="BREAKFAST"
          disabled
        >
          Breakfast
        </button>

        <button
          class="chip"
          type="button"
          data-kitchen-category="LUNCH"
          disabled
        >
          Lunch
        </button>

        <button
          class="chip"
          type="button"
          data-kitchen-category="DINNER"
          disabled
        >
          Dinner
        </button>

        <button
          class="chip"
          type="button"
          data-kitchen-category="SNACKS"
          disabled
        >
          Snacks
        </button>

        <button
          class="chip"
          type="button"
          data-kitchen-category="MEAL"
          disabled
        >
          Meals
        </button>
      </div>

      <div class="discovery-controls">
        <span
          id="discovery-radius"
          class="discovery-radius"
        >
          Within 3 km
        </span>

        <label
          class="visually-hidden"
          for="kitchen-sort"
        >
          Sort Kitchens
        </label>

        <select
          id="kitchen-sort"
          class="discovery-sort"
          disabled
        >
          <option value="NEAREST">
            Nearest
          </option>

          <option value="TOP_RATED">
            Top Rated
          </option>

          <option value="FASTEST">
            Fastest
          </option>

          <option value="PRICE_LOW_TO_HIGH">
            Price: Low to High
          </option>
        </select>
      </div>
    </section>

    <section class="customer-section">
      <div class="customer-section__header">
        <div>
          <h2 class="customer-section__title">
            Nearby Kitchens
          </h2>

          <p class="customer-section__subtitle">
            Homemade food near your delivery address
          </p>
        </div>

        <div class="customer-section__status">
          <span
            id="open-kitchen-count"
            class="kitchen-count"
          >
            0
          </span>

          <span
            id="backend-status"
            class="badge badge--warning"
          >
            Connecting
          </span>
        </div>
      </div>

      <button
        id="refresh-kitchens"
        class="discovery-refresh"
        type="button"
        disabled
      >
        Refresh
      </button>

      <div
        id="kitchen-list"
        class="kitchen-list"
        aria-live="polite"
      ></div>
    </section>

    <section
      id="closed-kitchen-section"
      class="customer-section"
      hidden
    >
      <div class="customer-section__header">
        <div>
          <h2 class="customer-section__title">
            Closed Kitchens
          </h2>

          <p class="customer-section__subtitle">
            These Kitchens are currently unavailable
          </p>
        </div>

        <span
          id="closed-kitchen-count"
          class="kitchen-count kitchen-count--muted"
        >
          0
        </span>
      </div>

      <div
        id="closed-kitchen-list"
        class="kitchen-list"
        aria-live="polite"
      ></div>
    </section>
  </main>

  <nav
    class="customer-bottom-nav"
    aria-label="Customer navigation"
  >
    <div class="customer-bottom-nav__inner">
      <a
        class="customer-bottom-nav__item customer-bottom-nav__item--active"
        href="home.html?v=15"
        aria-current="page"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
          ⌂
        </span>

        <span>Home</span>
      </a>

      <a
        class="customer-bottom-nav__item"
        href="orders.html"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
          ◫
        </span>

        <span>Orders</span>
      </a>

      <a
        class="customer-bottom-nav__item"
        href="account.html#rewards"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
          ☆
        </span>

        <span>Rewards</span>
      </a>

      <a
        class="customer-bottom-nav__item"
        href="account.html"
      >
        <span
          class="customer-bottom-nav__icon"
          aria-hidden="true"
        >
          ○
        </span>

        <span>Account</span>
      </a>
    </div>
  </nav>

  <script src="../assets/js/core.js?v=15"></script>
  <script src="../assets/js/api.js?v=15"></script>
  <script src="../assets/js/ui.js?v=15"></script>
  <script src="../assets/js/discovery.js?v=15"></script>

  <script>
    (function() {
      'use strict';

      const greeting =
        document.getElementById(
          'customer-greeting'
        );

      const headerLocation =
        document.getElementById(
          'header-location'
        );

      const changeLocationButton =
        document.getElementById(
          'change-location-button'
        );

      const locationHeaderButton =
        document.getElementById(
          'location-header-button'
        );

      function clean(value) {
        return String(value || '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function updateGreeting(user) {
        const fullName =
          clean(
            user && user.fullName
          );

        const firstName =
          fullName
            ? fullName.split(/\s+/)[0]
            : '';

        greeting.textContent =
          firstName
            ? 'Hello, ' +
              firstName +
              '!'
            : 'Hello!';
      }

      function displayLocation(location) {
        const locationName =
          clean(
            location &&
            location.locationName
          );

        const area =
          clean(
            location &&
            location.area
          );

        const city =
          clean(
            location &&
            location.city
          );

        headerLocation.textContent =
          locationName ||
          area ||
          city ||
          'Select delivery location';
      }

      function openLocationPage() {
        window.location.href =
          'location.html?v=14';
      }

      async function validateSession() {
        try {
          const response =
            await window.ApnaBiteAPI
              .validateSession();

          const user =
            response &&
            response.data
              ? response.data.user
              : null;

          if (
            !user ||
            user.role !== 'CUSTOMER'
          ) {
            window.ApnaBiteCore
              .redirectToRoleHome(
                user ? user.role : '',
                true
              );

            return null;
          }

          window.ApnaBiteCore
            .saveSession({
              sessionToken:
                window.ApnaBiteAPI
                  .getSessionToken(),
              user: user
            });

          updateGreeting(user);

          return user;
        } catch (error) {
          window.ApnaBiteUI
            .handleApiError(error);

          return null;
        }
      }

      function initialize() {
        if (
          !window.ApnaBiteCore
            .requireLocalSession(
              ['CUSTOMER']
            )
        ) {
          return;
        }

        const savedLocation =
          window.ApnaBiteCore
            .getJsonStorage(
              window.ApnaBiteCore
                .storageKeys.LOCATION,
              null
            );

        displayLocation(savedLocation);

        window.ApnaBiteDiscovery
          .setup(savedLocation);

        validateSession();
      }

      changeLocationButton
        .addEventListener(
          'click',
          openLocationPage
        );

      locationHeaderButton
        .addEventListener(
          'click',
          openLocationPage
        );

      window.ApnaBiteCore.ready(
        initialize
      );
    })();
  </script>
</body>
</html>
