<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta
    name="theme-color"
    content="#f97316"
  >
  <meta
    name="description"
    content="Select your ApnaBite delivery location."
  >

  <title>Select Location | ApnaBite</title>

  <link
    rel="manifest"
    href="../manifest.webmanifest"
  >
  <link
    rel="stylesheet"
    href="../assets/css/core.css"
  >
  <link
    rel="stylesheet"
    href="../assets/css/components.css"
  >
  <link
    rel="stylesheet"
    href="../assets/css/customer.css"
  >
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >
</head>

<body class="customer-page location-page">
  <header class="page-header">
    <div class="page-header__inner">
      <button
        id="location-back-button"
        class="icon-button"
        type="button"
        aria-label="Go back"
      >
        ←
      </button>

      <div class="page-header__content">
        <h1 class="page-header__title">
          Select delivery location
        </h1>

        <p class="page-header__subtitle">
          Choose where you want your food delivered
        </p>
      </div>
    </div>
  </header>

  <main class="location-main">
    <section class="location-search-section">
      <form
        id="location-search-form"
        class="location-search"
        autocomplete="off"
      >
        <label
          class="visually-hidden"
          for="location-search-input"
        >
          Search location
        </label>

        <input
          id="location-search-input"
          class="location-search__input"
          type="search"
          placeholder="Search area, block or landmark"
          minlength="3"
          maxlength="150"
        >

        <button
          id="location-search-button"
          class="location-search__button"
          type="submit"
          aria-label="Search location"
        >
          Search
        </button>
      </form>

      <p
        id="location-search-message"
        class="location-helper-text"
        aria-live="polite"
      ></p>
    </section>

    <section class="location-action-section">
      <button
        id="use-current-location"
        class="location-action"
        type="button"
      >
        <span
          class="location-action__icon"
          aria-hidden="true"
        >
          ◎
        </span>

        <span class="location-action__content">
          <strong>Use current location</strong>
          <small>Use your phone’s GPS location</small>
        </span>

        <span
          class="location-action__arrow"
          aria-hidden="true"
        >
          ›
        </span>
      </button>
    </section>

    <section
      id="saved-address-section"
      class="location-section"
      hidden
    >
      <div class="location-section__header">
        <h2 class="location-section__title">
          Saved addresses
        </h2>
      </div>

      <div
        id="saved-address-list"
        class="saved-address-list"
      ></div>
    </section>

    <section class="location-section">
      <div class="location-section__header">
        <h2 class="location-section__title">
          Set location on map
        </h2>

        <span class="location-section__hint">
          Move the map under the pin
        </span>
      </div>

      <div class="location-map-wrapper">
        <div
          id="location-map"
          class="location-map"
          role="application"
          aria-label="Delivery location map"
        ></div>

        <div
          class="location-map-pin"
          aria-hidden="true"
        >
          ●
        </div>

        <button
          id="map-current-location"
          class="location-map-current"
          type="button"
          aria-label="Move map to current location"
        >
          ◎
        </button>

        <div
          id="map-loading"
          class="location-map-loading"
        >
          Loading map…
        </div>
      </div>
    </section>

    <section class="selected-location-card">
      <span
        class="selected-location-card__icon"
        aria-hidden="true"
      >
        ⌖
      </span>

      <div class="selected-location-card__content">
        <span class="selected-location-card__label">
          SELECTED LOCATION
        </span>

        <strong
          id="selected-location-name"
          class="selected-location-card__name"
        >
          Select a location
        </strong>

        <p
          id="selected-location-address"
          class="selected-location-card__address"
        >
          Search, use GPS or move the map pin.
        </p>
      </div>
    </section>

    <div class="location-confirm-space"></div>
  </main>

  <footer class="location-confirm-bar">
    <button
      id="confirm-location-button"
      class="button button--primary button--full"
      type="button"
      disabled
    >
      CONFIRM LOCATION
    </button>
  </footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>
  <script src="../assets/js/core.js?v=7"></script>
  <script src="../assets/js/api.js?v=7"></script>
  <script src="../assets/js/ui.js?v=7"></script>
  <script src="../assets/js/customer.js?v=1"></script>
</body>
</html>
