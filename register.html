<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f97316"
  >

  <meta
    name="description"
    content="Create your ApnaBite account."
  >

  <title>Create Account | ApnaBite</title>

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="assets/css/core.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/components.css"
  >

  <style>
    .consent-box {
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 12px;
      padding: 13px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-medium);
      background: #f8fafc;
    }

    .consent-box__title {
      margin-bottom: 7px;
      font-size: 0.9rem;
    }

    .consent-box__text {
      margin: 0;
      color: var(--color-text-soft);
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .consent-links {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
      margin-top: 10px;
      font-size: 0.76rem;
      font-weight: 650;
    }
  </style>
</head>

<body>
  <main class="auth-page">
    <section
      class="auth-container"
      aria-labelledby="register-title"
    >
      <div class="auth-brand">
        <a
          class="auth-brand__name"
          href="index.html"
          aria-label="ApnaBite home"
        >
          ApnaBite
        </a>

        <p class="auth-brand__tagline">
          Ghar Ka Khana. Fresh. Apna Sa.
        </p>
      </div>

      <div class="auth-card">
        <h1
          id="register-title"
          class="auth-card__title"
        >
          Create account
        </h1>

        <p class="auth-card__subtitle">
          Join ApnaBite using your mobile number.
        </p>

        <form
          id="register-form"
          class="form"
          novalidate
        >
          <div class="form-group">
            <label
              class="form-label"
              for="register-role"
            >
              Register as
              <span class="form-label__required">
                *
              </span>
            </label>

            <select
              id="register-role"
              class="form-select"
              required
            >
              <option value="">
                Select your role
              </option>

              <option value="CUSTOMER">
                Customer
              </option>

              <option value="CHEF">
                Chef / Food Partner
              </option>

              <option value="RIDER">
                Rider / Delivery Partner
              </option>
            </select>

            <p
              id="register-role-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="register-name"
            >
              Full name
              <span class="form-label__required">
                *
              </span>
            </label>

            <input
              id="register-name"
              class="form-input"
              type="text"
              autocomplete="name"
              maxlength="120"
              placeholder="Enter your full name"
              required
            >

            <p
              id="register-name-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="register-mobile"
            >
              Mobile number
              <span class="form-label__required">
                *
              </span>
            </label>

            <div class="input-action">
              <input
                id="register-mobile"
                class="form-input"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="10"
                placeholder="10-digit mobile number"
                required
              >

              <button
                id="register-request-otp"
                class="button button--secondary"
                type="button"
              >
                GET OTP
              </button>
            </div>

            <p
              id="register-mobile-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <div
            id="register-otp-group"
            hidden
          >
            <div class="form-group">
              <label
                class="form-label"
                for="register-otp"
              >
                Enter OTP
                <span class="form-label__required">
                  *
                </span>
              </label>

              <input
                id="register-otp"
                class="form-input"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                placeholder="6-digit OTP"
                required
              >

              <p
                id="register-otp-help"
                class="form-help"
              ></p>

              <p
                id="register-otp-error"
                class="form-error"
                hidden
              ></p>
            </div>
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="register-email"
            >
              Email
              <span class="text-soft">
                (optional)
              </span>
            </label>

            <input
              id="register-email"
              class="form-input"
              type="email"
              autocomplete="email"
              maxlength="150"
              placeholder="Enter your email"
            >

            <p
              id="register-email-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="register-referral"
            >
              Referral code
              <span class="text-soft">
                (optional)
              </span>
            </label>

            <input
              id="register-referral"
              class="form-input"
              type="text"
              autocomplete="off"
              maxlength="30"
              placeholder="Enter referral code"
            >

            <p
              id="register-referral-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <div
            id="consent-section"
            class="form-group"
          >
            <div class="consent-box">
              <h2
                id="consent-title"
                class="consent-box__title"
              >
                Required service consent
              </h2>

              <p
                id="consent-text"
                class="consent-box__text"
              >
                Select your role to view the applicable ApnaBite service consent.
              </p>

              <nav
                class="consent-links"
                aria-label="ApnaBite policies"
              >
                <a
                  href="policies.html#terms"
                  target="_blank"
                  rel="noopener"
                >
                  Terms
                </a>

                <a
                  href="policies.html#privacy"
                  target="_blank"
                  rel="noopener"
                >
                  Privacy Policy
                </a>

                <a
                  href="policies.html#cancellation"
                  target="_blank"
                  rel="noopener"
                >
                  Cancellation/Refund
                </a>

                <a
                  href="policies.html#community"
                  target="_blank"
                  rel="noopener"
                >
                  Community Guidelines
                </a>
              </nav>
            </div>

            <label class="checkbox-field">
              <input
                id="register-consent"
                type="checkbox"
                required
              >

              <span
                id="consent-checkbox-text"
                class="checkbox-field__text"
              >
                I confirm that I have read and agree to the applicable ApnaBite policies.
              </span>
            </label>

            <p
              id="register-consent-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <button
            id="register-submit"
            class="button button--primary button--large button--block"
            type="submit"
            disabled
          >
            AGREE & CONTINUE
          </button>
        </form>

        <p class="auth-switch">
          Already registered?
          <a href="login.html">
            Login
          </a>
        </p>
      </div>
    </section>
  </main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js?v=5"></script>

  <script>
    (function() {
      'use strict';

      const roleSelect =
        document.getElementById(
          'register-role'
        );

      const consentCheckbox =
        document.getElementById(
          'register-consent'
        );

      const submitButton =
        document.getElementById(
          'register-submit'
        );

      const consentTitle =
        document.getElementById(
          'consent-title'
        );

      const consentText =
        document.getElementById(
          'consent-text'
        );

      const checkboxText =
        document.getElementById(
          'consent-checkbox-text'
        );

      const roleConsent = {
        CUSTOMER: {
          title: 'Customer consent',
          text:
            'I confirm that I am at least 18 years old and the information, address, receiver details and Order instructions provided by me are correct. I authorize ApnaBite to use my mobile number, location, saved addresses, Order, payment, device and session information for account security, nearby Kitchen discovery, payment confirmation, delivery, support, fraud prevention and legal compliance. Prices, discounts, rewards, fees and final payable amounts will be server-validated. Cancellation and refund will follow the displayed policy. I will not misuse payments, offers, referrals, OTPs, ratings or the platform. My mandatory legal rights remain unaffected.',
          checkbox:
            'I confirm my information is correct, authorize the required use of my location and personal data for ApnaBite services, and agree to the linked policies.'
        },

        CHEF: {
          title: 'Chef / Food Partner consent',
          text:
            'I confirm that my identity, Kitchen, FSSAI, bank/UPI and uploaded documents are genuine, accurate and current. I accept responsibility for food safety, hygiene, ingredients, allergens, preparation, freshness, quantity, quality, packaging, menu accuracy, stock and legal compliance. I authorize ApnaBite to verify my documents, display my approved Kitchen/menu, process Orders, calculate configured commissions and maintain transaction records. I will follow Order statuses, the cancellation window, approved Rider handover and Pickup OTP process. Valid refunds, reconciliation differences, fraud or policy violations may affect settlement with an auditable reason.',
          checkbox:
            'I confirm my information and documents are genuine, accept my food-safety and fulfilment responsibilities, and agree to the linked Chef policies.'
        },

        RIDER: {
          title: 'Rider / Delivery Partner consent',
          text:
            'I confirm that my identity, vehicle, licence, bank/UPI and uploaded documents are genuine, accurate and current. I authorize ApnaBite to verify my documents and use my availability, assignment, location, delivery, device and session information for fulfilment, safety, support, fraud prevention and legal compliance. I will accept only Deliveries I can complete, protect food and Customer information, follow Pickup and Delivery OTP procedures and not misuse Orders, payments or the platform. Valid refunds, reconciliation differences, fraud or policy violations may affect settlement with an auditable reason.',
          checkbox:
            'I confirm my information and documents are genuine, authorize required location use during delivery operations, and agree to the linked Rider policies.'
        }
      };

      function updateConsent() {
        const role =
          roleSelect.value;

        const selectedConsent =
          roleConsent[role];

        consentCheckbox.checked = false;
        submitButton.disabled = true;

        if (!selectedConsent) {
          consentTitle.textContent =
            'Required service consent';

          consentText.textContent =
            'Select your role to view the applicable ApnaBite service consent.';

          checkboxText.textContent =
            'I confirm that I have read and agree to the applicable ApnaBite policies.';

          return;
        }

        consentTitle.textContent =
          selectedConsent.title;

        consentText.textContent =
          selectedConsent.text;

        checkboxText.textContent =
          selectedConsent.checkbox;
      }

      roleSelect.addEventListener(
        'change',
        updateConsent
      );

      consentCheckbox.addEventListener(
        'change',
        function() {
          submitButton.disabled =
            !consentCheckbox.checked ||
            !roleSelect.value;
        }
      );

      window.ApnaBiteCore.ready(
        function() {
          if (
            window.ApnaBiteCore
              .isAuthenticated()
          ) {
            window.ApnaBiteCore
              .redirectToRoleHome(
                window.ApnaBiteCore
                  .getCurrentRole(),
                true
              );

            return;
          }

          updateConsent();
        }
      );
    })();
  </script>
</body>
</html>
