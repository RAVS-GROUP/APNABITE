<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f97316"
  >

  <meta
    name="description"
    content="ApnaBite homemade-food marketplace."
  >

  <title>ApnaBite</title>

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="assets/css/core.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/components.css"
  >

  <style>
    .splash-screen {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 24px) 20px
        calc(var(--safe-bottom) + 24px);
      background:
        radial-gradient(
          circle at top right,
          #ffedd5 0,
          transparent 36%
        ),
        linear-gradient(
          180deg,
          #ffffff 0%,
          #fffaf5 100%
        );
    }

    .splash-content {
      width: min(100%, 360px);
      text-align: center;
    }

    .splash-logo {
      width: min(72vw, 230px);
      max-height: 180px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    .splash-brand-fallback {
      display: none;
      margin-bottom: 8px;
      color: var(--color-primary-dark);
      font-size: 2.1rem;
      font-weight: 850;
    }

    .splash-tagline {
      margin: 0 0 28px;
      color: var(--color-text-soft);
      font-size: 0.92rem;
      font-weight: 550;
    }

    .splash-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--color-text-soft);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .splash-loader .loading-spinner {
      width: 22px;
      height: 22px;
      border-width: 2px;
    }

    .splash-error {
      margin-top: 20px;
    }

    .splash-error__message {
      margin-bottom: 12px;
      color: var(--color-error);
      font-size: 0.82rem;
    }
  </style>
</head>

<body>
  <main
    class="splash-screen"
    aria-labelledby="splash-title"
  >
    <section class="splash-content">
      <img
        id="splash-logo"
        class="splash-logo"
        src="assets/images/logo.png"
        alt="ApnaBite"
      >

      <h1
        id="splash-title"
        class="splash-brand-fallback"
      >
        ApnaBite
      </h1>

      <p class="splash-tagline">
        Ghar Ka Khana. Fresh. Apna Sa.
      </p>

      <div
        id="splash-loader"
        class="splash-loader"
        role="status"
      >
        <span
          class="loading-spinner"
          aria-hidden="true"
        ></span>

        <span id="splash-status">
          Starting ApnaBite…
        </span>
      </div>

      <div
        id="splash-error"
        class="splash-error"
        hidden
      >
        <p
          id="splash-error-message"
          class="splash-error__message"
        >
          Unable to start ApnaBite.
        </p>

        <button
          id="splash-retry"
          class="button button--primary button--block"
          type="button"
        >
          TRY AGAIN
        </button>
      </div>
    </section>
  </main>

  <noscript>
    <p class="page-state">
      JavaScript is required to use ApnaBite.
    </p>
  </noscript>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>

  <script>
    (function() {
      'use strict';

      const statusElement =
        document.getElementById(
          'splash-status'
        );

      const loaderElement =
        document.getElementById(
          'splash-loader'
        );

      const errorContainer =
        document.getElementById(
          'splash-error'
        );

      const errorMessage =
        document.getElementById(
          'splash-error-message'
        );

      const retryButton =
        document.getElementById(
          'splash-retry'
        );

      const logo =
        document.getElementById(
          'splash-logo'
        );

      const brandFallback =
        document.getElementById(
          'splash-title'
        );

      logo.addEventListener(
        'error',
        function() {
          logo.hidden = true;
          brandFallback.style.display =
            'block';
        }
      );

      function setStatus(message) {
        statusElement.textContent =
          message;
      }

      function showError(message) {
        loaderElement.hidden = true;
        errorContainer.hidden = false;

        errorMessage.textContent =
          message ||
          'Unable to start ApnaBite.';
      }

      function wait(milliseconds) {
  return new Promise(function(resolve) {
    window.setTimeout(
      resolve,
      milliseconds
    );
  });
}
      async function startApp() {
        loaderElement.hidden = false;
        errorContainer.hidden = true;

        setStatus(
          'Connecting securely…'
        );

        try {
          const minimumSplash =
            wait(600);

          await window.ApnaBiteAPI.health();

          await minimumSplash;

          const sessionToken =
            window.ApnaBiteCore
              .getSessionToken();

          if (!sessionToken) {
            window.ApnaBiteCore.navigate(
              'login.html',
              true
            );

            return;
          }

          setStatus(
            'Restoring your session…'
          );

          try {
            const response =
              await window.ApnaBiteAPI
                .validateSession();

            const user =
              response.data.user;

            window.ApnaBiteCore.saveSession({
              sessionToken:
                sessionToken,
              user: user
            });

            window.ApnaBiteCore
              .redirectToRoleHome(
                user.role,
                true
              );
          } catch (sessionError) {
            window.ApnaBiteCore
              .clearSession();

            window.ApnaBiteCore.navigate(
              'login.html',
              true
            );
          }
        } catch (error) {
          if (!navigator.onLine) {
            window.ApnaBiteCore.navigate(
              'offline.html',
              true
            );

            return;
          }

          showError(
            window.ApnaBiteUI
              .getFriendlyError(error)
          );
        }
      }

      retryButton.addEventListener(
        'click',
        startApp
      );

      window.ApnaBiteCore.ready(
        startApp
      );
    })();
  </script>
</body>
</html>
