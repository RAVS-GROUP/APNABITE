<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f97316"
  >

  <meta
    name="description"
    content="Login securely to your ApnaBite account."
  >

  <title>Login | ApnaBite</title>

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="assets/css/core.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/components.css"
  >
</head>

<body>
  <main class="auth-page">
    <section
      class="auth-container"
      aria-labelledby="login-title"
    >
      <div class="auth-brand">
        <a
          class="auth-brand__name"
          href="index.html"
          aria-label="ApnaBite home"
        >
          ApnaBite
        </a>

        <p class="auth-brand__tagline">
          Ghar Ka Khana. Fresh. Apna Sa.
        </p>
      </div>

      <div class="auth-card">
        <h1
          id="login-title"
          class="auth-card__title"
        >
          Welcome back
        </h1>

        <p class="auth-card__subtitle">
          Login securely using your mobile number.
        </p>

        <form
          id="login-form"
          class="form"
          novalidate
        >
          <div class="form-group">
            <label
              class="form-label"
              for="login-role"
            >
              Login as
              <span class="form-label__required">
                *
              </span>
            </label>

            <select
              id="login-role"
              class="form-select"
              autocomplete="off"
              required
            >
              <option value="">
                Select your role
              </option>

              <option value="CUSTOMER">
                Customer
              </option>

              <option value="CHEF">
                Chef / Food Partner
              </option>

              <option value="RIDER">
                Rider / Delivery Partner
              </option>
            </select>

            <p
              id="login-role-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="login-mobile"
            >
              Mobile number
              <span class="form-label__required">
                *
              </span>
            </label>

            <div class="input-action">
              <input
                id="login-mobile"
                class="form-input"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="10"
                placeholder="10-digit mobile number"
                required
              >

              <button
                id="login-request-otp"
                class="button button--secondary"
                type="button"
              >
                GET OTP
              </button>
            </div>

            <p
              id="login-mobile-error"
              class="form-error"
              hidden
            ></p>
          </div>

          <div
            id="login-otp-group"
            hidden
          >
            <div class="form-group">
              <label
                class="form-label"
                for="login-otp"
              >
                Enter OTP
                <span class="form-label__required">
                  *
                </span>
              </label>

              <input
                id="login-otp"
                class="form-input"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                placeholder="6-digit OTP"
                required
              >

              <p
                id="login-otp-help"
                class="form-help"
              ></p>

              <p
                id="login-otp-error"
                class="form-error"
                hidden
              ></p>
            </div>

            <button
              id="login-submit"
              class="button button--primary button--large button--block"
              type="submit"
            >
              LOGIN
            </button>
          </div>
        </form>

        <p class="auth-switch">
          New to ApnaBite?
          <a href="register.html">
            Create an account
          </a>
        </p>

        </div>

      <p class="text-center text-small text-soft margin-bottom-zero">
        Secure OTP login • No password required
      </p>
    </section>
  </main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js?v=5"></script>

  <script>
    (function() {
      'use strict';

      window.ApnaBiteCore.ready(function() {
        if (
          window.ApnaBiteCore
            .isAuthenticated()
        ) {
          window.ApnaBiteCore
            .redirectToRoleHome(
              window.ApnaBiteCore
                .getCurrentRole(),
              true
            );
        }
      });
    })();
  </script>
</body>
</html>
