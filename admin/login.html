<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <meta
    name="description"
    content="Secure ApnaBite Admin login."
  >

  <title>Admin Login | ApnaBite</title>

  <link
    rel="manifest"
    href="../manifest.webmanifest"
  >

  <link
    rel="stylesheet"
    href="../assets/css/core.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/components.css"
  >

  <link
    rel="stylesheet"
    href="../assets/css/admin.css"
  >
</head>

<body class="admin-page admin-login-page">
  <main class="admin-login-main">
    <section class="admin-login-card">
      <div class="admin-login-brand">
        <span
          class="admin-login-brand__icon"
          aria-hidden="true"
        >
          A
        </span>

        <div>
          <span>APNABITE</span>

          <h1>
            Admin Login
          </h1>
        </div>
      </div>

      <div
        id="admin-login-status"
        class="admin-login-status"
        aria-live="polite"
      >
        <span
          id="admin-login-status-icon"
          aria-hidden="true"
        >
          🔒
        </span>

        <div>
          <strong id="admin-login-status-title">
            Secure Admin access
          </strong>

          <p id="admin-login-status-message">
            Enter your registered Admin mobile number.
          </p>
        </div>
      </div>

      <form
        id="admin-login-mobile-form"
        class="admin-login-form"
        novalidate
      >
        <div class="admin-login-field">
          <label for="admin-login-mobile">
            Admin mobile number
          </label>

          <div class="admin-login-mobile-input">
            <span>+91</span>

            <input
              id="admin-login-mobile"
              type="tel"
              inputmode="numeric"
              maxlength="10"
              autocomplete="tel"
              placeholder="10-digit mobile number"
            >
          </div>

          <p
            id="admin-login-mobile-error"
            class="admin-field-error"
            role="alert"
            hidden
          ></p>
        </div>

        <button
          id="admin-login-request-button"
          class="admin-button admin-button--primary admin-button--large admin-login-submit"
          type="submit"
        >
          SEND OTP
        </button>
      </form>

      <form
        id="admin-login-otp-form"
        class="admin-login-form"
        novalidate
        hidden
      >
        <div class="admin-login-field">
          <label for="admin-login-otp">
            Enter OTP
          </label>

          <input
            id="admin-login-otp"
            class="admin-login-otp-input"
            type="text"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="••••••"
          >

          <p
            id="admin-login-otp-error"
            class="admin-field-error"
            role="alert"
            hidden
          ></p>
        </div>

        <div
          id="admin-login-test-otp"
          class="admin-login-test-otp"
          hidden
        >
          <span>TEST OTP</span>

          <strong id="admin-login-test-otp-value">
            —
          </strong>
        </div>

        <button
          id="admin-login-verify-button"
          class="admin-button admin-button--primary admin-button--large admin-login-submit"
          type="submit"
        >
          VERIFY & LOGIN
        </button>

        <button
          id="admin-login-resend-button"
          class="admin-login-link-button"
          type="button"
          disabled
        >
          Resend OTP in 60s
        </button>

        <button
          id="admin-login-change-mobile"
          class="admin-login-link-button"
          type="button"
        >
          Change mobile number
        </button>
      </form>

      <div class="admin-login-security">
        <span aria-hidden="true">i</span>

        <p>
          This page is restricted to authorized ApnaBite Admin accounts. All verification actions are recorded.
        </p>
      </div>

      <a
        class="admin-login-home-link"
        href="../index.html"
      >
        Return to ApnaBite
      </a>
    </section>
  </main>

  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/admin-login-v1.js"></script>
</body>
</html>
